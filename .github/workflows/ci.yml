name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]

    # GUI (PySide6) tests must run offscreen on headless ubuntu runners.
    # 4 gui test files do not set QT_QPA_PLATFORM themselves (they rely on
    # pytest collection order to set it globally, which is fragile). This
    # job-level env is the explicit, order-independent backstop.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime system libraries
        run: |
          # PySide6 wheels need system shared libs (libEGL.so.1, libGL, fontconfig...)
          # on headless ubuntu runners; offscreen platform still imports them at load time.
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare test environment
        run: |
          cat > .env <<'EOF'
          BASE_URL=https://example.com/v1
          API_KEY=sk-test
          MODEL_ID=test-model
          TAVILY_KEY=tvly-test
          EOF

      - name: Run tests (non-GUI subset)
        shell: bash
        run: |
          set +e
          # -X faulthandler: 原生崩溃留痕（faulthandler 帧落在 pytest-output.txt）。
          # -u: stdout 无缓冲——摘要行若停在用户态缓冲、进程中途 abort 即丢失，
          # 无摘要行则 139/134 容忍不成立（本机实证：缓冲版摘要缺失、-u 版幸存）。
          # 非 GUI 进程不收集/不导入 test_gui_*.py（--ignore-glob 按相对路径 glob 排除）
          # → 完全不碰 PySide6/Qt；崩族容忍保留（139/134 + 全绿摘要放行，保险路径）。
          python -X faulthandler -u -m pytest tests/ --ignore-glob='tests/test_gui_*.py' -q --tb=short --timeout=300 2>&1 | tee pytest-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 139 ] || [ "$rc" -eq 134 ]; then
            # tail -n 100：崩溃时 faulthandler 在摘要行之后追加 C 栈 trace，40 行窗口在部分平台可能刚好错过摘要行。
            summary_line=$(tail -n 100 pytest-output.txt | grep -E '^[0-9]+ (passed|failed|error)' | tail -n 1 || true)
            if echo "$summary_line" | grep -q 'passed' && ! echo "$summary_line" | grep -Eq 'failed|error'; then
              echo "::warning:pytest SIGSEGV/Aborted at interpreter teardown (exit $rc), but suite summary is all-pass: $summary_line - accepting green run (faulthandler trace in pytest-output.txt for diagnosis)"
              exit 0
            fi
          fi
          exit $rc

      - name: Run tests (GUI subset)
        shell: bash
        run: |
          set +e
          # GUI 子集单独进程：进程内禁自动 GC 周期（tests/conftest.py 收集钩子，
          # shiboken C 级 finalizer 崩族缓解；残余崩点 = pytest_unconfigure 的
          # gc_collect_harder 显式全量收集，属退出期容忍族）；-u 无缓冲保证全绿
          # 摘要行在中途 abort 时幸存（缓冲版实证丢失 → 容忍误红）；139/134 + 全绿
          # 摘要 = 已知容忍族放行（摘要锚定 ^[0-9]+，faulthandler 尾部 "error" 字样不误判）。
          # bash glob 在 CI（ubuntu）下展开为逐文件实参，安全。
          python -X faulthandler -u -m pytest tests/test_gui_*.py -q --tb=short --timeout=300 2>&1 | tee pytest-output-gui.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 139 ] || [ "$rc" -eq 134 ]; then
            # tail -n 100：摘要行之后还有 faulthandler C 栈 trace，40 行窗口可能刚好错过摘要行。
            summary_line=$(tail -n 100 pytest-output-gui.txt | grep -E '^[0-9]+ (passed|failed|error)' | tail -n 1 || true)
            if echo "$summary_line" | grep -q 'passed' && ! echo "$summary_line" | grep -Eq 'failed|error'; then
              echo "::warning:pytest GUI-subset native teardown crash (exit $rc), but suite summary is all-pass: $summary_line - accepting green run (faulthandler trace in pytest-output-gui.txt)"
              exit 0
            fi
          fi
          exit $rc

      - name: Save pytest output on failure
        if: failure()
        run: |
          echo "---- tail of pytest output (non-GUI) ----"
          tail -n 400 pytest-output.txt || true
          echo "---- tail of pytest output (GUI) ----"
          tail -n 400 pytest-output-gui.txt || true
        shell: bash

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-output
          path: |
            pytest-output.txt
            pytest-output-gui.txt

