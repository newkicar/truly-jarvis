[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — 通用个人 AI 助手（TUI）"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "deepagents==0.7.6",
    "langchain>=1.3.14,<2",
    "langchain-core>=1.5,<2",
    "langchain-openai>=1.5",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-quickjs>=0.3.3",
    "langchain-mcp-adapters>=0.3.2",
    "langmem==0.0.30",
    "textual>=0.40.0",
    "tavily-python",
    "httpx",
    "apscheduler>=3.10",
    # GUI（桌面端，PySide6；打包走 Essentials 避免捆 Addons/WebEngine）
    "PySide6-Essentials>=6.5",
    "keyring",
    # Office skills
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# 遗留 c：RAG 原生大包不入基础客户端；缺 chromadb 自动回落 grep/wiki（rag.py 降级守卫）。
# 开发机/需要语义检索时：pip install -e ".[rag]"
rag = ["chromadb>=0.5.0"]

[project.scripts]
jarvis = "src.main:main"
jarvis-gui = "src.gui_main:main"

[tool.setuptools.packages.find]
include = ["src*", "jarvis*", "skills*"]

[tool.setuptools.package-data]
src = ["*.md"]
skills = ["**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
